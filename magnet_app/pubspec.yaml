name: magnet_app
description: MagNET — BLE scan, provisioning and control for MagNET Hanasu mesh nodes.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core / UI ---
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3

  # --- App metadata ---
  package_info_plus: ^8.1.0
  device_info_plus: ^11.2.0

  # --- State management ---
  provider: ^6.1.2

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Localization (EN + JA) ---
  intl: ^0.20.2

  # --- Bluetooth LE scan + connect ---
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # --- WiFi scanning (Android full; iOS connected-network only) ---
  wifi_scan: ^0.4.1+2
  network_info_plus: ^6.1.1

  # --- mDNS/Bonjour discovery for the optional WiFi relay proxy ---
  nsd: ^2.3.1

  # --- Settings persistence ---
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  pointycastle: ^4.0.0
  wakelock_plus: ^1.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Code-gen the AppLocalizations class from lib/l10n/*.arb at build
  # time. See l10n.yaml for the template + output paths.
  generate: true

  assets:
    - assets/images/icon-192.png
    - assets/images/magnet-icon-512.png
    - assets/images/magnet-splash.png

# App icons for every platform. Regenerate the source art with
#   python3 tool/gen_icon.py
# then  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/magnet-icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true          # the App Store rejects alpha channels
  macos:
    generate: true
    image_path: "assets/images/magnet-icon-1024.png"
  web:
    generate: true
    background_color: "#05060B"
    theme_color: "#22D3EE"
  windows:
    generate: true
    icon_size: 256

# Launch screen: the luminous mark on the same deep-space field the icon
# uses, so the splash and the icon read as one thing.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#05060B"
  image: assets/images/magnet-splash.png
  color_dark: "#05060B"
  image_dark: assets/images/magnet-splash.png
  android_12:
    image: assets/images/magnet-splash.png
    color: "#05060B"
    icon_background_color: "#05060B"
  ios: true
  android: true
  web: false
