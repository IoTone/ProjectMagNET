[platformio]
default_envs = esp32s3

; ESPIDFORTH defaults to tests=1 (the framework's own self-test suite runs
; at boot); explicit `_release` envs override back to tests=0. espidforth_base's
; default is tests=0, so the test-enabled envs override build_flags inline.

[espidforth_base]
; Inlined from the MagNET monorepo's magnet-common.ini at repo extraction
; (2026-08-14) so this repository is self-contained.
;
; The platform_packages pin matters: the bare PlatformIO framework-espidf
; symlink is shared machine-wide, and an ESP-IDF v5.4 overlay on a v5.3 tree
; produces "Multiple ways to build the same target: esp_efuse_fields.c.o" on
; every esp32c-anything build. Pinning to the versioned install sidesteps the
; shared symlink entirely — and gives CI a reproducible toolchain for free.
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
monitor_speed = 115200
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0

[env:esp32s3]
extends = espidforth_base
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"

[env:esp32s3_release]
extends = espidforth_base
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"

[env:esp32c3]
extends = espidforth_base
board = esp32-c3-devkitc-02
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c3"

[env:esp32c3_release]
extends = espidforth_base
board = esp32-c3-devkitc-02
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c3"

[env:esp32c6]
extends = espidforth_base
board = esp32-c6-devkitc-1
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6"

[env:esp32]
extends = espidforth_base
board = esp32dev
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
