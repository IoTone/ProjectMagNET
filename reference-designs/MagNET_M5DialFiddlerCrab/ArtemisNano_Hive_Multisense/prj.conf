# M3: console, LED, Qwiic bus, RTC (RV-1805 via ambiq,am1805), fuel gauge (LC709203F),
# OPT4048 + BNO085 (app-level drivers, float math).
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_FUEL_GAUGE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=2048
