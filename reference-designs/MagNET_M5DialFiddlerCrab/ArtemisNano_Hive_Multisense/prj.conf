# M4: sensors (RV-1805, LC709203F, OPT4048, BNO085) + BLE MagNET advert and HCP GATT.
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_FUEL_GAUGE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=2048

# BLE peripheral: MagNET advert + Hanasu HCP GATT service
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_DEVICE_NAME="MagNET"
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_ATT_PREPARE_COUNT=4

# Pairing: Just Works, HCP-AUTH read forces encryption; bonds kept in flash
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
