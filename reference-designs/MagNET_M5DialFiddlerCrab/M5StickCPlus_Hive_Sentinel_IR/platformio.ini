[platformio]
default_envs = m5stickc_plus
extra_configs = ../magnet-common.ini

[env:m5stickc_plus]
; M5StickC Plus (original, AXP192) — ESP32-PICO-D4, 4 MB flash, NO PSRAM.
; USB console is a CH552 bridge enumerating as FTDI (VID 0x0403) → UART0.
; There is no m5stick-c-plus board def; m5stick-c is the right SoC/flash shape.
; Not for the StickC Plus2 (no AXP192, hold-pin power latch).
extends = magnet_base
board = m5stick-c
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
; pio's monitor otherwise asserts DTR/RTS, which the StickC Plus bridge turns
; into a held reset: the monitor shows nothing and typing does nothing.
monitor_dtr = 0
monitor_rts = 0
