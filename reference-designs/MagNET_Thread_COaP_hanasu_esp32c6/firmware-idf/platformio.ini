; MagNET Hanasu — ESP-IDF firmware (E-Phase A coexistence spike)
;
; Goal of this build: prove ESPIDFORTH + esp_openthread + mbedTLS fit and run
; together on a no-PSRAM ESP32-C6, and measure the real flash/RAM footprint
; BEFORE committing to ESPIDFORTH as the Hanasu foundation. See README.md.
;
; The `forth` component is pulled in from the existing ESPIDFORTH tree via
; EXTRA_COMPONENT_DIRS in CMakeLists.txt (not vendored, so the spike tracks
; upstream). `magnet` lives in this project's components/ dir.

[platformio]
default_envs = esp32c6
; Shared base: pins framework-espidf @ 3.50301.0 (IDF 5.3.1). Do NOT let this
; drift to 5.4 — that reintroduces the efuse-collision build break.
extra_configs = ../../MagNET_M5DialFiddlerCrab/magnet-common.ini

[env:esp32c6]
extends = magnet_base
board = esp32-c6-devkitc-1
; The devkitc-1 manifest claims 8 MB flash, which stamps an 8 MB image header;
; on a 4 MB part (M5NanoC6, XIAO C6) IDF's startup flash probe then asserts and
; the node crash-loops. Pin 4 MB — safe on 8 MB parts too (matches sdkconfig).
board_upload.flash_size = 4MB
; Pre-build: sanitize OpenThread's space-containing BUILD_DATETIME define, which
; PlatformIO otherwise mis-quotes into a compile error. Idempotent. See script.
extra_scripts = pre:patch_openthread_datetime.py
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1        ; keep `test` available during bringup
  -DMN_ENABLE_OPENTHREAD=1           ; flip to 0 to measure footprint WITHOUT Thread
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6"
board_build.partitions = partitions.csv

; XIAO ESP32C6 variant: identical firmware + the XIAO's RF-switch bringup
; (GPIO3 low = switch enabled, GPIO14 low = built-in ceramic antenna). Without
; this the XIAO's 802.15.4 radio is effectively antenna-less. NanoC6/devkit
; boards have no switch and use the plain esp32c6 env.
[env:esp32c6_xiao]
extends = magnet_base
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
extra_scripts = pre:patch_openthread_datetime.py
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
  -DMN_ENABLE_OPENTHREAD=1
  -DMN_XIAO_RF_SWITCH=1
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6"
board_build.partitions = partitions.csv

; Footprint-comparison env: identical, but Thread compiled out. Build both and
; diff the .bin sizes / `mem` output to see exactly what OpenThread costs.
[env:esp32c6_noot]
extends = magnet_base
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
extra_scripts = pre:patch_openthread_datetime.py
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=1
  -DMN_ENABLE_OPENTHREAD=0
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6"
board_build.partitions = partitions.csv
