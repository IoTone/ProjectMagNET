# MagNET Hanasu on Zephyr — XIAO MG24 (phase Z-B)

# ---- host link: USART0 is BOTH the HCP link and Zephyr's default console.
# Everything that could print to it is off, or it breaks §11.3 framing.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# ---- kernel
# = IDF CONFIG_ESP_MAIN_TASK_STACK_SIZE. Boot re-applies persisted role bundles
# on main (cJSON + TweetNaCl Ed25519 + Forth eval); 4 KB smashed the stack.
CONFIG_MAIN_STACK_SIZE=8192
# xTaskCreate → k_thread_stack_alloc
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=0
# k_malloc: task stacks (link 8K, pump 4K, stress 4K transient) + queues/timers
CONFIG_HEAP_MEM_POOL_SIZE=24576
# malloc: 64 KB Forth heap + core
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=81920
# SYSINFO / `mem` heap figures
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REBOOT=y
# reset cause, EUI-64
CONFIG_HWINFO=y
CONFIG_GPIO=y

# ---- C++ for the Forth engine (forth_core.cpp uses <cstdio> etc.)
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# ---- storage (NVS compat + OpenThread dataset share settings)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=n

# ---- networking / OpenThread (full router, CoAP, configured by magnet_ot.c)
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_MANUAL_START=y
# OT allows ONE state-changed handler by default and Zephyr's L2 takes it;
# without room for magnet_ot.c's, every !ROLE event silently disappears.
CONFIG_OPENTHREAD_MAX_STATECHANGE_HANDLERS=3
# Zephyr's IP stack only ferries single 802.15.4 frames (≤127 B) between the
# radio driver and OpenThread — MagNET's CoAP lives in OT's own message pool.
# Defaults (16 KB of net_buf data) are sized for sockets we never open.
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_MAX_CONTEXTS=2

# ---- crypto (§11.1 on PSA)
# OpenThread's DEFAULT security profile makes every PSA/mbedTLS symbol
# promptless (unsettable), and it has no HKDF. CUSTOM unlocks them — at the
# price of spelling out what the default profile selected. The list below is
# exactly the Z-A spike's resolved config (known good on this board) + HKDF.
CONFIG_OPENTHREAD_SECURITY_CUSTOM_CONFIG=y
CONFIG_SECURE_STORAGE=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# The SE has no DETERMINISTIC ECDSA, so mn_sign falls back to software bignum
# math on this heap. The 1 KB default fails with PSA_ERROR_INSUFFICIENT_MEMORY
# (caught by the RFC 6979 power-on KAT).
CONFIG_MBEDTLS_HEAP_SIZE=6144
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
# MagNET additions
CONFIG_PSA_WANT_ALG_HKDF=y
# one-shot PBKDF2: native on the Secure Engine for Secure Vault High parts
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_MBEDTLS_BASE64_C=y

# ---- OTA (Z-F): mark a freshly swapped image good once the node is healthy
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
