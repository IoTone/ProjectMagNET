# Z-A spike: stock Zephyr OpenThread shell sample on XIAO MG24, joined to the
# ESP32-C6 Hanasu bench mesh. Build (from ~/zephyrproject):
#   west build -b xiao_mg24 zephyr/samples/net/openthread/shell -d build/za -- \
#     -DEXTRA_CONF_FILE=<this dir>/magnet-dev.conf
# Dataset mirrors firmware-idf/components/magnet/magnet_ot.c (dev key, NOT secret).

CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_CHANNEL=24
CONFIG_OPENTHREAD_PANID=19790
CONFIG_OPENTHREAD_NETWORK_NAME="MagNET-dev"
CONFIG_OPENTHREAD_XPANID="4d:61:67:4e:45:54:76:32"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
