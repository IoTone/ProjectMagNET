# Z-E: BLE-GATT HCP binding (§11.2.1) — Zephyr BT host + Silabs controller.
#   west build ... -- -DEXTRA_CONF_FILE=ble.conf
# Concurrent BLE + 802.15.4 needs RAIL's multiprotocol library (the driver's
# scheduler-priority Kconfigs only matter on multiprotocol builds).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MagNET"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
# NOT BT_SMP_SC_ONLY: SC-only mode demands authenticated (MITM) keys, which a
# screenless Just Works node can never produce. Legacy stays as fallback, as
# on the C6 (CONFIG_BT_NIMBLE_SM_LEGACY=y).
# A phone that lost its bond (app reinstall, FACTORY RESET) may pair again —
# NimBLE's REPEAT_PAIRING retry (BLE-PAIRING.md §3).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_DYNAMIC_DB=n
# ATT MTU 247 (client SHOULD request it — §11.2.1)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Long (prepared) writes: ADMIN ADD <130-hex pubkey> exceeds one ATT payload
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_SILABS_SISDK_RAIL_MULTIPROTOCOL=y
# RAM: the BT host + controller glue costs ~19 KB. Pay for it from the malloc
# arena, whose measured low-water mark (boot bundle re-apply + BUNDLE COMMIT)
# was 34 KB free of 80 KB (46 KB peak use; Forth heap 16 KB in this build) —
# 52 KB leaves ~15 KB at that peak (4 KB went to the kernel heap for the pump).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=53248
# kernel heap: + the mn_ble_rx worker's 6 KB stack (pump is 8 KB since the OTA sink)
CONFIG_HEAP_MEM_POOL_SIZE=32768
