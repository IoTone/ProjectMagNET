# Z-F: MCUboot + dual-slot images. Build with --sysbuild.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE unset = MCUboot's DEV key. Replace before
# any node leaves the bench — anyone holding the dev key can sign firmware.
# swap-using-MOVE, not the default swap-using-offset: offset mode expects the
# upgrade image one sector INTO slot1, so an image written at the slot start
# is silently ignored (observed). Move mode = images at slot start; slot0
# keeps one spare sector for the shuffle, so max image = 712 KB - 8 KB - trailer.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
