# Debug overlay: crash reports on the console. Breaks HCP framing — bring-up
# only. Build with  -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# stack overflows report as such instead of a garbage EXC_RETURN
CONFIG_MPU_STACK_GUARD=y
